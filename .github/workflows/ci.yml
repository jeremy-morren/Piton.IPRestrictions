name: CI

on:
  pull_request:
  # draft.yml runs the same build and tests before it drafts a release.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # A newer push to the same pull request (or branch) supersedes this run.
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # publish-unit-test-result-action comments the test results on a pull request.
      pull-requests: write
    env:
      results: src/artifacts/test-results
      coverage: src/artifacts/coverage
      solution: src/Piton.IPRestrictions.slnx
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          # 6.0, 7.0, 8.0 and 9.0 are here for their runtimes: the tests run on every target framework.
          # global.json pins the SDK that builds.
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.solution }}

      # GeneratePackageOnBuild: the build also produces the package.
      - name: Build
        run: dotnet build ${{ env.solution }} --no-restore -c Release

      - name: Test (net6.0, net7.0, net8.0, net9.0 and net10.0)
        run: >-
          dotnet test ${{ env.solution }} --no-build -c Release
          --collect "Code Coverage;Format=cobertura"
          --logger trx
          --results-directory "${{ env.results }}"

      # Comments the test results on the pull request (edited on each run), and nowhere else.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          check_name: Test results
          files: ${{ env.results }}/**/*.trx
          check_run: false
          job_summary: false

      # Merges the per-framework reports. The collector covers every module with symbols, so the report
      # keeps the library only, and drops source-generated files (e.g. the logging generator's).
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        if: ${{ !cancelled() }}
        with:
          reports: ${{ env.results }}/**/*.cobertura.xml
          targetdir: ${{ env.coverage }}
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: +Piton.IPRestrictions.Endpoints*
          filefilters: -*.g.cs
          title: Code coverage

      # The coverage goes to the job summary only.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: cat "${{ env.coverage }}/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: ${{ env.results }}/**/*.trx

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: ${{ env.coverage }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            src/artifacts/package/release/*.nupkg
            src/artifacts/package/release/*.snupkg
          if-no-files-found: error
